name: Build Aseprite

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Aseprite Version (z.B. v1.3.11)'
        required: false
        default: 'v1.3.11'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Aseprite Source Code
        uses: actions/checkout@v4
        with:
          repository: aseprite/aseprite
          ref: ${{ github.event.inputs.version || 'v1.3.11' }}
          submodules: recursive
          path: aseprite

      - name: Download Skia Dependencies
        run: |
          curl -L -o skia.zip https://github.com/aseprite/skia/releases/download/m124-08a543864b/Skia-Windows-Release-x64.zip
          7z x skia.zip -oskia

      - name: Setup Ninja Build Tool
        uses: ashutoshvarma/setup-ninja@master
        with:
          version: 1.11.1

      - name: Setup Visual Studio MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        run: |
          cd aseprite
          mkdir build
          cd build
          cmake -DCMAKE_BUILD_TYPE=RelWithDebInfo -DLAF_BACKEND=skia -DSKIA_DIR=..\..\skia -DSKIA_LIBRARY_DIR=..\..\skia\out\Release-x64 -DSKIA_LIBRARY=..\..\skia\out\Release-x64\skia.lib -G Ninja ..

      - name: Compile Aseprite
        run: |
          cd aseprite\build
          ninja aseprite

      - name: Package Binaries
        run: |
          mkdir package
          copy aseprite\build\bin\aseprite.exe package\
          xcopy /E /I aseprite\build\bin\data package\data

      - name: Upload Finished Aseprite ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Aseprite-Windows-x64
          path: package/
