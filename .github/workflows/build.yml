name: Build and Export Aseprite

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Aseprite Source
        uses: actions/checkout@v4
        with:
          repository: aseprite/aseprite
          submodules: recursive
          ref: v1.3.11

      - name: Download Skia Dependencies
        run: |
          curl -L -o skia.zip https://github.com/aseprite/skia/releases/download/m124-08a543864b/Skia-Windows-Release-x64.zip
          7z x skia.zip -oskia

      - name: Setup Ninja Build Tool
        uses: aseprite/get-ninja@main

      - name: Setup MSVC Compiler
        uses: TheMrMilchmann/setup-msvc-dev@v4

      - name: Compile Aseprite
        run: |
          mkdir build
          cd build
          cmake -DCMAKE_BUILD_TYPE=RelWithDebInfo -DLAF_BACKEND=skia -DSKIA_DIR=..\skia -DSKIA_LIBRARY_DIR=..\skia\out\Release-x64 -DSKIA_LIBRARY=..\skia\out\Release-x64\skia.lib -G Ninja ..
          ninja aseprite

      - name: Package Aseprite
        run: |
          mkdir Aseprite-Windows-x64
          copy build\bin\aseprite.exe Aseprite-Windows-x64\
          xcopy /E /I build\bin\data Aseprite-Windows-x64\data

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aseprite-Windows-x64
          path: Aseprite-Windows-x64/
