name: Build and Export Aseprite

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Skia
        uses: aseprite/get-skia@main

      - name: Setup Ninja
        uses: aseprite/get-ninja@main

      - name: Setup MSVC Compiler
        uses: TheMrMilchmann/setup-msvc-dev@v4

      - name: Generating Makefiles
        shell: bash
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DENABLE_TESTS=OFF \
            -DENABLE_GUI=ON \
            -DLAF_BACKEND=skia \
            -DSKIA_DIR=$skia_path \
            -DSKIA_LIBRARY_DIR=$skia_path/out/Release-x64 \
            -DSKIA_LIBRARY=$skia_path/out/Release-x64/skia.lib

      - name: Compiling Aseprite
        shell: bash
        run: |
          cd build && ninja aseprite

      - name: Package Aseprite
        shell: bash
        run: |
          mkdir -p package/data
          cp build/bin/aseprite.exe package/
          cp -r build/bin/data/* package/data/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aseprite-Windows-x64
          path: package/
