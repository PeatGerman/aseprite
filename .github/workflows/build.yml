name: Build and Export Aseprite

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Skia
        shell: bash
        run: |
          skia_path="${RUNNER_TEMP}/skia"
          skia_url=$(bash ./laf/misc/skia-url.sh)
          echo "Downloading Skia from: $skia_url"
          curl -s -L -o skia.zip "$skia_url"
          7z x skia.zip -o"$skia_path" -y
          echo "skia_path=$skia_path" >> $GITHUB_ENV

      - name: Setup Ninja
        uses: aseprite/get-ninja@main

      - name: Setup MSVC Compiler
        uses: TheMrMilchmann/setup-msvc-dev@v4

      - name: Generating Makefiles
        shell: bash
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DENABLE_TESTS=OFF \
            -DENABLE_GUI=ON \
            -DLAF_BACKEND=skia \
            -DSKIA_DIR="$skia_path" \
            -DSKIA_LIBRARY_DIR="$skia_path/out/Release-x64" \
            -DSKIA_LIBRARY="$skia_path/out/Release-x64/skia.lib"

      - name: Compiling Aseprite
        shell: bash
        run: |
          cd build && ninja aseprite

      - name: Package Aseprite
        shell: bash
        run: |
          mkdir -p package/data
          cp build/bin/aseprite.exe package/
          cp -r build/bin/data/* package/data/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aseprite-Windows-x64
          path: package/
